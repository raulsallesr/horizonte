name: Relatar um problema
description: Informe um erro de cálculo, interface ou funcionamento.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Não inclua dados financeiros reais ou sensíveis. Prefira um exemplo fictício ou o link com valores anonimizados.
  - type: textarea
    id: problema
    attributes:
      label: O que aconteceu?
      description: Descreva o resultado observado e o que você esperava.
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      description: Liste os passos e, se seguro, as premissas fictícias usadas.
    validations:
      required: true
  - type: dropdown
    id: dispositivo
    attributes:
      label: Onde ocorreu?
      options:
        - Computador
        - Celular
        - Tablet
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador e versão
      placeholder: Ex. Chrome 155
  - type: textarea
    id: evidencias
    attributes:
      label: Evidências adicionais
      description: Capturas, mensagens de erro ou observações, sem dados sensíveis.
