name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium e dependências do sistema
        run: npx playwright install --with-deps chromium
      - name: Verificar código
        run: npm run lint
      - name: Executar testes unitários
        run: npm test
      - name: Gerar build de produção
        run: npm run build
      - name: Executar testes E2E
        run: npm run test:e2e
      - name: Verificar orçamentos Lighthouse
        run: npm run test:lighthouse
      - name: Guardar relatórios de qualidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-qualidade
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
